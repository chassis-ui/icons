packages:
  - packages/*

# Our own packages install at any age. Dependabot hands its 3-day cooldown to pnpm as a minimum
# release age when it resolves the lockfile again, which rejects a Chassis release that develop
# already requires. See the cooldown in .github/dependabot.yml, which exempts the same packages.
minimumReleaseAgeExclude:
  - '@chassis-ui/*'

# html-validate has matchers for Vitest 3 and 4, which nothing here uses. The test of the site
# runs on the Vitest of the tests of the build.
peerDependencyRules:
  allowedVersions:
    'html-validate>vitest': '5'

# Two moderate advisories of the build's tools that no version in their ranges fixes:
# fantasticon and svg-sprite pin glob 7 and 10, and with them minimatch 3 and 9. Neither is
# reachable from what a set controls: the build passes its own patterns over the folders of
# the repository, and passes no AbortSignal. Remove an entry when its tool takes a fixed glob.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249 # minimatch <11.0.1: denial of service through a crafted pattern
    - GHSA-3g3m-2fjr-6pw4 # glob 9 to 14.0.1: a search goes on after its AbortSignal fires
