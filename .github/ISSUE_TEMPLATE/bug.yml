name: Bug report
description: An icon that is drawn wrong, a file of the package that is missing or broken, or a build or check that fails, for the Chassis set or for a set of your own
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        This repository holds the icons of the Chassis Design System and the build that turns the SVG files of any set into optimized SVG files, an SVG sprite and an icon font. A problem with a token, a style or a component belongs in [that project's repository](https://github.com/chassis-ui).
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - An icon, in source/ or packages/icons/svgs/
        - The sprite, the icon font or its CSS and SCSS, in packages/icons/icons/
        - The package, its manifest or an import that does not resolve
        - The build, pnpm icons
        - A check, such as pnpm icons:lint:source or pnpm icons:verify
        - Building a set of my own, with the steps of the README
        - A release, pnpm changeset:version or the release workflow
        - The documentation site
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. Include the exact error message or the output of the command if there was one, or a screenshot for an icon.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: The name of the icon and how you use it (SVG file, sprite, font or Sass), or the command you ran. For a set of your own, add the `chassis.build` block of `packages/icons/package.json`. `pnpm icons --verbose` says more.
      placeholder: <i class="cx-search-outline"></i>
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The version of `@chassis-ui/icons` or the commit, and the browser, the bundler or the Node.js version.
      placeholder: 0.4.0, Safari 26
