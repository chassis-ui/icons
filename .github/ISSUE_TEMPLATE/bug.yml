name: Bug report
description: A file of the output that the build writes wrong, a file of the package that is missing or broken, or a command or a check that fails
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        This repository holds the builder that turns the SVG files of any set into optimized SVG files, an SVG sprite and an icon font, and holds no icons. A problem with how an icon is drawn belongs in the repository of its set. A problem with a token, a style or a component belongs in [that project's repository](https://github.com/chassis-ui).
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - The build: chassis-icons build, verify, lint-source, archive, release-notes or init
        - The output of a set: an SVG file, the sprite, the icon font or its CSS and SCSS
        - The package, its manifest or an import that does not resolve
        - A script of this repository, such as pnpm icons:test or pnpm icons:fixture
        - Building a set of my own, with the steps of the README
        - A release, pnpm changeset:version or the release workflow
        - The documentation site
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. Include the exact error message or the output of the command if there was one, or a screenshot for an icon.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: The command you ran, and the `chassis.build` block of the `package.json` of the set. For a file of the output, the name of the icon and how you use it (SVG file, sprite, font or Sass). `chassis-icons build --verbose` says more.
      placeholder: chassis-icons build --only font
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The version of `@chassis-ui/icons` or the commit, and the browser, the bundler or the Node.js version.
      placeholder: 0.4.0, Safari 26
