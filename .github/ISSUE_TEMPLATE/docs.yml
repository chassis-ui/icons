name: Documentation
description: Something on the documentation site, in the README, in CONTRIBUTING.md or in docs/architecture.md is wrong, missing or unclear
labels: [documentation, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        For the docs of Chassis CSS, Tokens, Assets, Figma or React, open the issue in [that project's repository](https://github.com/chassis-ui).
  - type: input
    id: location
    attributes:
      label: Where
      description: The page URL or the file.
      placeholder: https://chassis-ui.com/icons/search-outline/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: If a document says something the build does not do, or names a command, a path or an option that does not exist, include the command and what it printed.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
      description: Optional. A suggested wording helps.
