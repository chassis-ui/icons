name: Release

# On a push to main, releases the version in packages/icons/package.json when it is new:
# publishes the package when its registry does not have the version, and creates the GitHub
# release of the tag v<version>, from the CHANGELOG entry of the version and with the archive
# of the output attached, when the tag does not exist. The version and the CHANGELOG are made
# on develop with Changesets. See "Releases" in CONTRIBUTING.md.
#
# The workflow names no package. What is released is read from packages/icons/package.json:
# `name` and `version`; `private`, which leaves the registry out, so that the release is the
# tag and the archive; and `publishConfig`, whose `access` and `provenance` npm reads when it
# publishes.
#
# The checks of ci.yml ran on this commit when it was pushed to develop, and the ruleset of
# main requires them before the commit can reach main. This workflow does not run them again.
# It reads their results and stops unless each one passed.
#
# npm trusted publishing: the package on npmjs.com trusts this workflow file of this
# repository, so no npm token is needed. Renaming this file breaks publishing until the
# trusted publisher on npmjs.com is updated to match.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be publishing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Version
    # A manual run on another branch stops here
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      dist-tag: ${{ steps.package.outputs.dist-tag }}
      prerelease: ${{ steps.package.outputs.prerelease }}
      publish: ${{ steps.registry.outputs.publish }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A prerelease such as 0.4.0-next.0 goes to the dist-tag `next`, and a version without a
      # prerelease part to `latest`. A numeric prerelease such as 0.4.0-0 goes to `next`,
      # because npm rejects a dist-tag that is a version range.
      - name: Read the package
        id: package
        run: |
          field() { node -p "const p = require('./packages/icons/package.json'); $1"; }

          NAME=$(field 'p.name')
          VERSION=$(field 'p.version')
          PRIVATE=$(field 'p.private === true')
          PRERELEASE=${VERSION#*-}

          if [ "$PRERELEASE" = "$VERSION" ]; then
            DIST_TAG=latest
          else
            DIST_TAG=${PRERELEASE%%.*}
            case "$DIST_TAG" in
              '' | *[!0-9A-Za-z-]* | [0-9]*) DIST_TAG=next ;;
            esac
          fi

          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "private=$PRIVATE"
            echo "dist-tag=$DIST_TAG"
            echo "prerelease=$([ "$DIST_TAG" = latest ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo "$NAME $VERSION, dist-tag $DIST_TAG, private $PRIVATE"

      - name: Check whether the registry has the version
        id: registry
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          PRIVATE: ${{ steps.package.outputs.private }}
        run: |
          if [ "$PRIVATE" = true ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "The package is private. Nothing is published to a registry."
          elif npm view "$NAME@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "npm has $NAME $VERSION. Nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "npm does not have $NAME $VERSION. It will be published."
          fi

      # Asked apart from the registry, so that a run that published and then failed can be
      # run again for the GitHub release alone
      - name: Check whether the version has a tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "The tag v$VERSION exists. No GitHub release to create."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "The tag v$VERSION does not exist. Its GitHub release will be created."
          fi

  checks:
    name: Checks Passed
    needs: detect
    if: needs.detect.outputs.publish == 'true' || needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: Read the results of CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: |
            Lint
            Type Check
            Build
            Site
        run: |
          RESULTS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name')
          MISSING=0

          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue

            if printf '%s\n' "$RESULTS" | grep -qxF "$NAME"; then
              echo "passed: $NAME"
            else
              echo "::error::The check '$NAME' has not passed on $GITHUB_SHA"
              MISSING=1
            fi
          done <<< "$REQUIRED"

          exit $MISSING

  release:
    name: Release
    needs: [detect, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub release and its tag
      id-token: write # for npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # With the tags: the code points are compared with those of the last one
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node.js 24 ships npm 11, which trusted publishing needs (11.5.1 or later)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package is the committed files of icons/ and svgs/ in packages/icons. Fails when
      # one of them is not what the source builds, or when an icon lost its code point
      - name: Verify the output
        run: pnpm icons:verify

      # Before publishing, so a version without a CHANGELOG entry is not published
      - name: Release notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: node build/release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      # Before publishing too: <font>-<version>.zip, with icons/ and svgs/ in it
      - name: Archive the output
        run: node build/release-archives.js --to "$RUNNER_TEMP/archives"

      # npm reads `access` and `provenance` from `publishConfig` of the package
      - name: Publish to npm
        if: needs.detect.outputs.publish == 'true'
        working-directory: packages/icons
        env:
          DIST_TAG: ${{ needs.detect.outputs.dist-tag }}
        run: npm publish --tag "$DIST_TAG"

      # Runs only when no step before it failed. The tag is created with the release, on
      # this commit. A prerelease is marked as one and does not become the latest release
      - name: Create the GitHub release
        if: needs.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.detect.outputs.name }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi

          gh release create "v$VERSION" \
            "$RUNNER_TEMP"/archives/*.zip \
            --target "$GITHUB_SHA" \
            --title "$NAME v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}"
