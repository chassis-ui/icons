name: CI

on:
  push:
    # A commit reaches `main` only after these checks passed on it, so they run on `develop`
    # first. Their results belong to the commit, and the ruleset of `main` and the release
    # workflow read them there, so pushing the same commit to `staging` or `main` does not
    # run them again. See "Releases" in CONTRIBUTING.md.
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running one. A push to `develop` always
# runs to the end: the ruleset and the release workflow read the results of that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset of `main` requires Lint, Type Check, Build and Site by these names, and
  # release.yml reads them. Rename a job in all three places.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint build scripts
        run: pnpm icons:lint

      - name: Lint site
        run: pnpm site:lint:eslint

      - name: Stylelint
        run: pnpm site:lint:stylelint

      # The whole repository, less what .prettierignore names
      - name: Prettier
        run: pnpm lint:prettier

      # The Markdown files, with the words of .cspell.json
      - name: Spelling
        run: pnpm spellcheck

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check of the build
        run: pnpm icons:typecheck

      - name: Astro check
        run: pnpm check:astro

  # The package: the SVG files, the sprite and the icon font, built from source/
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # With the tags: the code points are compared with those of the last one
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every file of source/ can be an icon: its name, its frame, its color, its pair
      - name: Lint the source
        run: pnpm icons:lint:source

      - name: Test
        run: pnpm icons:test

      # The output of the package is committed, and the site, Vercel and chassis-assets read
      # the committed files. Builds into a temporary folder and fails when a committed file
      # is not what the source builds, when an icon lost the code point it had at the last
      # tag, or when an icon of chassis.checks.json is missing.
      - name: Verify the output
        run: pnpm icons:verify

      # What npm would publish: the fields of package.json point at files that the package
      # holds, in a form that bundlers and Node.js resolve
      - name: Lint the package
        run: pnpm icons:lint:package

      # The oldest version that `engines` of the package allows
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Test on Node.js 22
        run: pnpm icons:test

  # The same build as Vercel: checks out and builds vendor/assets, then Astro and Pagefind.
  # The site reads the committed files of packages/icons.
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm site:build

      - name: Validate HTML
        run: pnpm site:lint:html

      # Skipped, with a warning, on a runner without Java
      - name: Validate HTML with the Nu Html Checker
        run: pnpm site:lint:vnu

  # A change to source/, to the build of packages/icons or to its output needs a changeset;
  # `pnpm changeset --empty` adds one that releases nothing. A pull request is compared with
  # its base branch, a push to develop with the tip it replaced. The version commit consumes
  # the changesets, so a change of the version passes. `changeset status` cannot see source/:
  # it is outside the package that has the version. So the job runs a script that reads Git,
  # and needs no install.
  changeset:
    name: Changeset
    # A manual run has nothing to compare with
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script compares with an earlier commit
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Nothing is installed, so there is no pnpm store to cache
          package-manager-cache: false

      - name: Check for a changeset
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            SINCE="origin/$BASE_REF"
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No earlier commit to compare with"
              exit 0
            fi

            SINCE="$BEFORE"
          fi

          node build/check-changeset.js "$SINCE"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The audit installs nothing, so there is no pnpm store to cache. The cache's post
          # step would fail the job.
          package-manager-cache: false

      # Blocking: what a consumer of the package installs with it. The package has no
      # dependencies, so this passes until one is added.
      - name: Audit runtime dependencies
        run: pnpm check:pnpm

      # Reports only: the build, lint and site tooling is in none of the published files
      - name: Audit all dependencies
        run: pnpm audit
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
