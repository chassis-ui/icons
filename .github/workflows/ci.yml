name: CI

on:
  push:
    # A commit reaches `main` only after these checks passed on it, so they run on `develop`
    # first. Their results belong to the commit, and the ruleset of `main` and the release
    # workflow read them there, so pushing the same commit to `staging` or `main` does not
    # run them again. See "Releases" in CONTRIBUTING.md.
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running one. A push to `develop` always
# runs to the end: the ruleset and the release workflow read the results of that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset of `main` requires Lint, Type Check, Build and Site by these names, and
  # release.yml reads them. Rename a job in all three places.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint build scripts
        run: pnpm icons:lint

      - name: Lint site
        run: pnpm site:lint:eslint

      - name: Stylelint
        run: pnpm site:lint:stylelint

      # The whole repository, less what .prettierignore names
      - name: Prettier
        run: pnpm lint:prettier

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check:astro

  # The package: the SVG files, the sprite and the icon font, built from source/
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build icons
        run: pnpm icons

      # icons/ and svgs/ of the package are committed, and the site, Vercel and chassis-assets
      # read the committed files. A change to source/ or to the build that was committed
      # without its output shows up here as a changed, a new or a deleted file.
      - name: Verify that the committed output is what the build writes
        working-directory: packages/icons
        run: |
          if [ -n "$(git status --porcelain -- icons svgs codepoints.json)" ]; then
            git status --short -- icons svgs codepoints.json
            git diff --stat -- icons svgs codepoints.json
            echo "::error::The output of packages/icons differs from what the build writes. Run 'pnpm icons' and commit the result."
            exit 1
          fi

      # Every file of svgs/ has an entry in the font, and every entry has a file
      - name: Check icon consistency
        run: pnpm icons:check

  # The same build as Vercel: checks out and builds vendor/assets, then Astro and Pagefind.
  # The site reads the committed files of packages/icons.
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm site:build

      - name: Validate HTML
        run: pnpm site:lint:html

      # Skipped, with a warning, on a runner without Java
      - name: Validate HTML with the Nu Html Checker
        run: pnpm site:lint:vnu

  # A change to icons/ or svgs/ of packages/icons, the files of the package, needs a changeset
  # (changedFilePatterns in .changeset/config.json); `pnpm changeset --empty` adds one that
  # releases nothing. A pull request is compared with its base branch, a push to develop with
  # the tip it replaced. The version commit consumes the changesets, so a push that changes
  # the version is skipped.
  changeset:
    name: Changeset
    # A manual run has nothing to compare with
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares with an earlier commit
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            SINCE="origin/$BASE_REF"
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No earlier commit to compare with"
              exit 0
            fi

            # The commit before the workspace layout has the manifest at the root
            OLD_VERSION=$( (git show "$BEFORE:packages/icons/package.json" 2>/dev/null || git show "$BEFORE:package.json") | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            NEW_VERSION=$(node -p 'require("./packages/icons/package.json").version')
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "The push changes the version ($OLD_VERSION → $NEW_VERSION): a version step, which consumes changesets"
              exit 0
            fi

            SINCE="$BEFORE"
          fi

          pnpm changeset status --since "$SINCE"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The audit installs nothing, so there is no pnpm store to cache. The cache's post
          # step would fail the job.
          package-manager-cache: false

      # Blocking: what a consumer of the package installs with it. The package has no
      # dependencies, so this passes until one is added.
      - name: Audit runtime dependencies
        run: pnpm check:pnpm

      # Reports only: the build, lint and site tooling is in none of the published files
      - name: Audit all dependencies
        run: pnpm audit
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
