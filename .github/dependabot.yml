version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Dependabot waits 3 days after a release by default, and passes that on to pnpm as its
    # minimum release age when it resolves the lockfile again, so a Chassis package that
    # develop already requires fails the whole run until it is 3 days old. A Chassis release
    # can be an urgent fix between our own packages: they are exempt here, and from pnpm's
    # check in pnpm-workspace.yaml. Everything else keeps the default.
    cooldown:
      default-days: 3
      exclude:
        - '@chassis-ui/*'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # A dependency goes into the first group that matches it.
      # The Chassis packages move together, and change what the site copies and styles.
      chassis:
        patterns: ['@chassis-ui/*']
      astro:
        patterns: ['astro', '@astrojs/*']
      # Minor and patch updates of the rest of the tooling in one pull request. The packages
      # that write the output of packages/icons are left out: they get a pull request each, since they
      # can change the output. Major updates get a pull request each.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - fantasticon
          - svg-sprite
          - svgo
          - clean-css
          - handlebars

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
